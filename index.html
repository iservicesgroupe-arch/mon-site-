<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="i-SERVICES GROUPE - Solutions électriques professionnelles, dépannage, maintenance, rénovation, solaire et sécurité.">

<title>i-SERVICES GROUPE | Solutions électriques professionnelles</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
    scroll-padding-top:95px;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#fff;
    color:#202020;
    line-height:1.6;
    overflow-x:hidden;
}

:root{
    --orange:#f28c28;
    --orange-dark:#d96f0b;
    --orange-light:#fff4e8;
    --black:#171717;
    --text:#252525;
    --muted:#707070;
    --border:#e8e8e8;
    --white:#fff;
    --whatsapp:#25D366;
    --whatsapp-dark:#1fbd5b;
    --shadow:0 10px 30px rgba(0,0,0,.06);
    --shadow-hover:0 16px 38px rgba(0,0,0,.10);
}

svg{
    display:block;
}

.icon{
    width:20px;
    height:20px;
    flex:none;
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(255,255,255,.97);
    border-bottom:1px solid #ededed;
    box-shadow:0 5px 25px rgba(0,0,0,.06);
    backdrop-filter:blur(12px);
}

.header-inner{
    max-width:1200px;
    min-height:74px;
    margin:auto;
    padding:10px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:25px;
}

.logo{
    position:relative;
    font-size:21px;
    font-weight:900;
    letter-spacing:.5px;
    white-space:nowrap;
}

.logo::before{
    content:"";
    display:inline-block;
    width:4px;
    height:24px;
    margin-right:8px;
    vertical-align:-5px;
    background:var(--orange);
    border-radius:5px;
}

.logo span{
    color:var(--orange);
}

nav{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    flex-wrap:wrap;
    gap:4px;
}

nav a{
    position:relative;
    color:#303030;
    text-decoration:none;
    padding:10px 12px;
    border-radius:9px;
    font-size:12.5px;
    font-weight:700;
    transition:.2s ease;
}

nav a:hover{
    color:var(--orange-dark);
    background:var(--orange-light);
}

nav a:last-child{
    color:#fff;
    background:var(--orange);
    padding:10px 16px;
    border-top:2px solid #ffbd79;
    border-left:2px solid #ffbd79;
    border-right:2px solid #171717;
    border-bottom:2px solid #171717;
    box-shadow:0 5px 15px rgba(242,140,40,.22);
}

nav a:last-child:hover{
    color:#fff;
    background:var(--orange-dark);
}

.orange-line{
    height:3px;
    background:linear-gradient(
        90deg,
        transparent 0%,
        var(--orange) 20%,
        var(--orange-dark) 50%,
        var(--orange) 80%,
        transparent 100%
    );
}

/* HERO */

.hero{
    min-height:650px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:90px 20px;
    position:relative;
    overflow:hidden;

    background:
    linear-gradient(
        rgba(255,255,255,.90),
        rgba(255,255,255,.96)
    ),
    url("i-SERVICES 20260712_234352.jpg");

    background-size:cover;
    background-position:center;
}

.hero::before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    width:7px;
    height:100%;
    background:var(--orange);
}

.hero-circle{
    position:absolute;
    border:1px solid rgba(242,140,40,.18);
    border-radius:50%;
    pointer-events:none;
}

.hero-circle.one{
    width:500px;
    height:500px;
    right:-250px;
    top:-220px;
}

.hero-circle.two{
    width:330px;
    height:330px;
    left:-190px;
    bottom:-180px;
}

.hero-circle.three{
    width:150px;
    height:150px;
    right:12%;
    bottom:8%;
    border-color:rgba(242,140,40,.10);
}

.hero-content{
    max-width:920px;
    position:relative;
    z-index:2;
}

.hero-badge{
    display:inline-flex;
    align-items:center;
    gap:9px;
    padding:9px 17px;
    border:1px solid #f3cfaa;
    background:var(--orange-light);
    color:var(--orange-dark);
    border-radius:40px;
    font-size:12px;
    font-weight:800;
    margin-bottom:25px;
}

.hero-badge svg{
    width:18px;
    height:18px;
}

.hero h1{
    font-size:47px;
    line-height:1.1;
    color:var(--black);
    margin-bottom:23px;
    letter-spacing:-1px;
}

.hero h1 span{
    color:var(--orange);
}

.hero p{
    max-width:760px;
    margin:0 auto 32px;
    color:#555;
    font-size:18px;
    line-height:1.8;
}

.hero-buttons{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
}

/* BOUTONS */

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    min-height:47px;
    padding:12px 21px;
    margin:4px;
    border-radius:10px;
    text-decoration:none;
    font-size:12.5px;
    font-weight:800;
    cursor:pointer;

    border-top:2px solid var(--orange);
    border-left:2px solid var(--orange);
    border-right:2px solid var(--black);
    border-bottom:2px solid var(--black);

    transition:.2s ease;
    box-shadow:0 5px 12px rgba(0,0,0,.10);
}

.btn:hover{
    transform:translateY(-2px);
    box-shadow:0 9px 20px rgba(0,0,0,.15);
}

.btn:active{
    transform:translateY(2px) scale(.97);
}

.btn svg{
    width:18px;
    height:18px;
    flex:none;
}

.btn-orange{
    background:var(--orange);
    color:#fff;
}

.btn-orange:hover{
